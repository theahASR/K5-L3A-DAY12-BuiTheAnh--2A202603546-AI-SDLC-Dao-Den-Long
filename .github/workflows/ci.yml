name: CI Verification

on:
  push:
    branches: [main]
    tags: ['phase-*', 'v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build web & headless
        run: npm run build
      - name: Run unit & contract tests
        run: npm test
      - name: Run headless scenarios & determinism check
        run: node scripts/verify-phase1.mjs --ci
