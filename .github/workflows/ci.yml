name: CI Verification

on:
  push:
    branches: [main]
    tags: ['phase-*', 'v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build web, headless, soak & bench CLIs
        run: npm run build
      - name: Run unit, CLI, Phase 1–4 tests
        run: npm test
      - name: Run Phase 4 verification gate (Phase 1–3 regression, soak, leaderboard export)
        run: node scripts/verify-phase4.mjs --ci
